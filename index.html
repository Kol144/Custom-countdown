<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Cuenta regresiva</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1b1f;--line:#303136;--text:#f5f5f3;--muted:#a1a2a6;--accent:#f3f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(960px,100%);display:grid;gap:16px}.preview{min-height:330px;border:1px solid var(--line);border-radius:16px;background:#090a0c;display:grid;place-items:center;position:relative;overflow:hidden}.time{font-family:var(--timer-font,Horizon,Arial,sans-serif);font-size:clamp(5rem,17vw,12rem);font-weight:600;letter-spacing:.025em;font-variant-numeric:tabular-nums;z-index:1;text-align:center}.tag{position:absolute;top:22px;color:#a1a2a6;font-size:12px;letter-spacing:.23em}.done{color:#c5f2d0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px}.row{display:flex;align-items:end;flex-wrap:wrap;gap:12px}.field{display:grid;gap:6px}label,.caption,summary{font-size:13px;color:var(--muted)}input,select,button,.file-button{min-height:40px;border-radius:9px;border:1px solid var(--line);background:#111216;color:var(--text);padding:0 11px;font:inherit}input[type=number]{width:82px}input[type=color]{width:54px;padding:4px;cursor:pointer}input[type=range]{height:22px;min-height:22px;padding:0;accent-color:#e5e5df;width:170px}input[type=checkbox]{width:17px;min-height:17px;accent-color:#e5e5df}.file-button,button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.file-button:hover,button:hover{background:#27282d}.primary{background:#f3f3ef;color:#101114;border-color:#f3f3ef;font-weight:700}.primary:hover{background:#d8d8d3}.file-button input{display:none}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{min-height:18px;color:var(--muted);font-size:13px}.customize{padding:0}.customize summary{cursor:pointer;list-style:none;font-size:15px;font-weight:650;color:var(--text);padd @keyframes neonPulse{0%,100%{text-shadow:0 0 6px #fff,0 0 18px #ff2b98,0 0 42px #ff176f,0 0 76px #ff176f}50%{text-shadow:0 0 9px #fff,0 0 28px #ff73cd,0 0 64px #ff2b98,0 0 118px #ff176f}}@keyframes materialShine{0%{background-position:-160% 0,center}100%{background-position:160% 0,center}}#display[data-material="neon"]{animation:neonPulse 1.25s ease-in-out infinite}#display[data-material="gold"],#display[data-material="chrome"],#display[data-material="metal"],#display[data-material="copper"]{animation:materialShine 2.8s ease-in-out infinite}#display[data-material="ice"]{text-shadow:0 0 10px #adf4ff,0 0 25px rgba(59,199,255,.85)}</style></head><body><main class="app"><section class="preview" id="preview"><div class="tag">CUENTA REGRESIVA</div><div class="time" id="display">30:00</div></section><section class="panel"><div class="row"><div class="field"><label for="hours">Horas</label><input id="hours" type="number" min="0" max="99" value="0"></div><div class="field"><label for="minutes">Minutos</label><input id="minutes" type="number" min="0" max="59" value="30"></div><div class="field"><label for="seconds">Segundos</label><input id="seconds" type="number" min="0" max="59" value="0"></div><div class="field"><label for="resolution">Resolución de video</label><select id="resolution"><option value="854x480">480p</option><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K</option></select></div></div><div class="row"><div class="field"><label>Tipografía</label><label class="file-button">Añadir tipografía<input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/*"></label></div><div class="caption" id="fontLabel">Horizon (si está instalada) · si no, se usará Arial</div></div><div class="actions"><button id="start" class="primary">Iniciar cuenta</button><button id="pause">Pausar</button><button id="reset">Reiniciar</button><button id="export" class="primary">Exportar video</button></div><div class="s const $=s=>document.querySelector(s),display=$('#display'),preview=$('#preview'),status=$('#status');let duration=1800,left=duration,running=false,last=performance.now(),recorder=null,fontFamily='Horizon';const settings={thickness:0,fontColor:'#f5f5f3',backgroundColor:'#090a0c',saturation:100,brightness:100,contrast:100,highlights:20,sharpness:0,effect:'none',depth3d:false};const textureCache={},textureUrls={},materialPaths={chrome:'chrome.jpg',gold:'gold.jpg',metal:'metal.jpg',wood:'wood.jpg',stone:'stone.jpg',neon:'neon.jpg',ice:'ice.jpg',copper:'copper.jpg',carbon:'carbon.jpg',marble:'marble.jpg',lava:'lava-texture.jpg',rust:'rust.jpg'},materialImages={},textureBases={chrome:[36,42,50],gold:[175,116,20],metal:[112,119,125],wood:[92,48,24],stone:[20,45,61],neon:[18,5,24],ice:[119,194,219],copper:[151,75,39],carbon:[20,22,26],marble:[218,211,199],lava:[31,17,12],rust:[107,50,29]};for(const [type,path] of Object.entries(materialPaths)){const image=new Image();materialImages[type]=image;image.onload=()=>{textureCache[type]=image;textureUrls[type]=null;if(settings.effect===type)syncSettings()};image.src='assets/'+path}
function getMaterialTexture(type){if(materialImages[type]?.complete&&materialImages[type].naturalWidth)return materialImages[type];if(textureCache[type])return textureCache[type];const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d'),base=textureBases[type]||textureBases.chrome;let seed=Array.from(type).reduce((a,ch)=>a+ch.charCodeAt(0)*17,97);const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const im=g.createImageData(512,512);for(let y=0;y<512;y++)for(let x=0;x<512;x++){const i=(y*512+x)*4,n=(rand()-.5)*42,wave=type==='wood'?Math.sin(x*.11+Math.sin(y*.025)*8)*22:type==='metal'||type==='chrome'?Math.sin(y*.23)*20:type==='gold'?Math.sin(x*.08+y*.03)*16:0;im.data[i]=Math.max(0,Math.min(255,base[0]+n+wave));im.data[i+1]=Math.max(0,Math.min(255,base[1]+n+wave*.7));im.data[i+2]=Math.max(0,Math.min(255,base[2]+n+wave*.35));im.data[i+3]=255}g.putImageData(im,0,0);const line=(x1,y1,x2,y2,color,width,blur=0)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.shadowColor=color;g.shadowBlur=blur;g.stroke();g.shadowBlur=0};

if(type==='ice'){for(let i=0;i<28;i++){let x=rand()*512,y=rand()*512,ang=rand()*6.28;for(let j=0;j<5;j++){const nx=x+Math.cos(ang)* (24+rand()*48),ny=y+Math.sin(ang)*(24+rand()*48);line(x,y,nx,ny,'rgba(233,255,255,.88)',1+rand()*2,5);if(rand()>.45)ang+=(rand()-.5)*1.5;x=nx;y=ny}}}
if(type==='neon'||type==='lava'){for(let x=-600;x<1000;x+=38+rand()*15){const col=type==='neon'?(rand()>.5?'#ff278f':'#ff572f'):(rand()>.5?'#ff3c08':'#ffc12a');g.beginPath();g.moveTo(x,0);g.lineTo(x+512,512);g.strokeStyle=col;g.lineWidth=type==='neon'?18:9;g.shadowColor=col;g.shadowBlur=type==='neon'?30:22;g.stroke();g.shadowBlur=0;g.strokeStyle=type==='neon'?'#ffe9ff':'#fff1a6';g.lineWidth=type==='neon'?4:2;g.stroke()}}

function readDuration(){const h=Math.max(0,Math.min(99,Number($('#hours').value)||0)),m=Math.max(0,Math.min(59,Number($('#minutes').value)||0)),s=Math.max(0,Math.min(59,Number($('#seconds').value)||0));return h*3600+m*60+s}function fmt(n){const v=Math.max(0,Math.ceil(n)),h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function paint(){display.textContent=fmt(left);display.classList.toggle('done',left<=0)}function loop(now){if(running){left=Math.max(0,left-(now-last)/1000);paint();if(left<=0){running=false;if(recorder?.state==='recording')recorder.stop()}}last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);$('#fontFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const family='CustomTimerFont';const face=new FontFace(family,await f.arrayBuffer());await face.load();document.fonts.add(face);fontFamily=family;document.documentElement.style.setProperty('--timer-font','"'+family+'"');$('#fontLabel').textContent='Fuente cargada: '+f.name;status.textContent='Tipografía aplicada a la vista previa y al video.'}catch(err){status.textContent='No se pudo cargar la fuente. Usa TTF, OTF, WOFF o WOFF2.'}};function cssGradient(effect){const stops=materialStops[effect];return stops?'linear-gradient(180deg,'+stops.map(x=>x[1]+' '+Math.round(x[0]*100)+'%').join(',')+')':'none'}function syncSettings(){const t=Number($('#thickness').value);settings.thickness=t;settings.fontColor=$('#fontColor').value;settings.backgroundColor=$('#backgroundColor').value;settings.saturation=Number($('#saturation').value);settings.brightness=Number($('#brightness').value);settings.contrast=Number($('#contrast').value);settings.highlights=Number($('#highlights').value);settings.sharpness=Number($('#sharpness').value);settings.effect=$('#effect').value;settings.depth3d=$('#depth3d').checked;$('#thicknessValue').textContent=(t>0?'+':'')+t;for(const id of ['saturation','brightness','contrast','highlights','sharpness'])$('#'+id+'Value').textContent=$('#'+id).value+'%';for(const [id,key] of [['fontColor','fontColor'],['backgroundColor','backgroundColor']])$('#'+id+'Value').textContent=settings[key].toUpperCase();preview.style.backgroundColor=settings.backgroundColor;preview.style.filter='none';display.style.filter='saturate('+settings.saturation+'%) brightness('+settings.brightness+'%) contrast('+settings.contrast+'%)';display.style.fontWeight=String(Math.round(300+(t+100)*3));display.style.color=settings.effect==='none'?settings.fontColor:'transparent';const glossy=['chrome','gold','metal','copper'].includes(settings.effect);const finishBands={chrome:'linear-gradient(180deg,#111720 0%,#f8fbff 12%,#75808e 24%,#111720 38%,#ffffff 51%,#58616d 65%,#eef2f7 80%,#202630 100%)',gold:'linear-gradient(180deg,#553600 0%,#fff0a0 12%,#a86d08 25%,#fff8c5 39%,#684000 52%,#f8d34b 66%,#fff3a6 82%,#5c3c03 100%)',metal:'linear-gradient(180deg,#30363d 0%,#f7f9fc 16%,#929ba4 32%,#30363d 48%,#e8edf2 64%,#6f7780 80%,#e5e9ed 100%)',copper:'linear-gradient(180deg,#472318 0%,#ffd1a0 13%,#a45030 27%,#f6b27b 41%,#502719 54%,#c86b42 67%,#f7c49d 82%,#492116 100%)'};const bands=finishBands[settings.effect];display.style.backgroundImage=settings.effect==='none'?'none':(glossy?'linear-gradient(115deg,transparent 34%,rgba(255,255,255,.75) 47%,rgba(255,255,255,.12) 51%,transparent 64%),'+bands+',':'')+textureUrl(settings.effect);display.style.backgroundSize=settings.effect==='none'?'auto':(glossy?'240% 100%,100% 100%,100% 100%':'100% 100%');display.style.backgroundRepeat=glossy?'no-repeat,no-repeat,no-repeat':'no-repeat';display.style.backgroundPosition=glossy?'-160% 0,center,center':'center';display.style.backgroundBlendMode=glossy?'screen,soft-light,normal':'normal';display.dataset.material=settings.effect;display.style.backgroundClip='text';display.style.webkitBackgroundClip='text';display.style.webkitTextFillColor=setti
