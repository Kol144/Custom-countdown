<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Cuenta regresiva</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1b1f;--line:#303136;--text:#f5f5f3;--muted:#a1a2a6;--accent:#f3f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(960px,100%);display:grid;gap:16px}.preview{min-height:330px;border:1px solid var(--line);border-radius:16px;background:#090a0c;display:grid;place-items:center;position:relative;overflow:hidden}.time{font-family:var(--timer-font,Horizon,Arial,sans-serif);font-size:clamp(5rem,17vw,12rem);font-weight:600;letter-spacing:.025em;font-variant-numeric:tabular-nums;z-index:1;text-align:center}.tag{position:absolute;top:22px;color:#a1a2a6;font-size:12px;letter-spacing:.23em}.done{color:#c5f2d0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px}.row{display:flex;align-items:end;flex-wrap:wrap;gap:12px}.field{display:grid;gap:6px}label,.caption,summary{font-size:13px;color:var(--muted)}input,select,button,.file-button{min-height:40px;border-radius:9px;border:1px solid var(--line);background:#111216;color:var(--text);padding:0 11px;font:inherit}input[type=number]{width:82px}input[type=color]{width:54px;padding:4px;cursor:pointer}input[type=range]{height:22px;min-height:22px;padding:0;accent-color:#e5e5df;width:170px}input[type=checkbox]{width:17px;min-height:17px;accent-color:#e5e5df}.file-button,button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.file-button:hover,button:hover{background:#27282d}.primary{background:#f3f3ef;color:#101114;border-color:#f3f3ef;font-weight:700}.primary:hover{background:#d8d8d3}.file-button input{display:none}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{min-height:18px;color:var(--muted);font-size:13px}.customize{padding:0}.customize summary{cursor:pointer;list-style:none;font-size:15px;font-weight:650;color:var(--text);padding:17px 20px}.customize summary::-webkit-details-marker{display:none}.customize summary:after{content:'＋';float:right;color:var(--muted)}.customize[open] summary:after{content:'−'}.customize-body{border-top:1px solid var(--line);padding:18px 20px 20px;display:grid;gap:20px}.group{display:grid;gap:11px}.group-title{font-weight:650;font-size:13px}.range-field{display:grid;grid-template-columns:minmax(145px,190px) minmax(130px,1fr) 48px;align-items:center;gap:12px}.range-field label{color:var(--text)}.range-field output{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:12px}.color-field{display:flex;align-items:center;gap:9px}.toggle{display:flex;align-items:center;gap:9px;color:var(--text);font-size:13px}.caption{font-size:12px}.effect-select{min-width:190px}.color-chip{font-size:12px;color:var(--muted);min-width:118px}@media(max-width:620px){body{padding:12px}.preview{min-height:250px}.panel{padding:15px}.customize summary{padding:15px}.customize-body{padding:15px}.range-field{grid-template-columns:1fr 1.2fr 42px;gap:8px}.range-field input{width:100%}.time{font-size:19vw}}
</style></head><body><main class="app"><section class="preview" id="preview"><div class="tag">CUENTA REGRESIVA</div><div class="time" id="display">30:00</div></section><section class="panel"><div class="row"><div class="field"><label for="hours">Horas</label><input id="hours" type="number" min="0" max="99" value="0"></div><div class="field"><label for="minutes">Minutos</label><input id="minutes" type="number" min="0" max="59" value="30"></div><div class="field"><label for="seconds">Segundos</label><input id="seconds" type="number" min="0" max="59" value="0"></div><div class="field"><label for="resolution">Resolución de video</label><select id="resolution"><option value="854x480">480p</option><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K</option></select></div></div><div class="row"><div class="field"><label>Tipografía</label><label class="file-button">Añadir tipografía<input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/*"></label></div><div class="caption" id="fontLabel">Horizon (si está instalada) · si no, se usará Arial</div></div><div class="actions"><button id="start" class="primary">Iniciar cuenta</button><button id="pause">Pausar</button><button id="reset">Reiniciar</button><button id="export" class="primary">Exportar video</button></div><div class="status" id="status">El video se graba en tiempo real y se descarga al terminar.</div></section><details class="panel customize" id="customize"><summary>Personalización</summary><div class="customize-body"><section class="group"><div class="group-title">Grosor</div><div class="range-field"><label for="thickness">Grosor de la tipografía</label><input id="thickness" type="range" min="-100" max="100" value="0"><output id="thicknessValue">0</output></div><div class="caption">−100 más fino · +100 más grueso</div></section><section class="group"><div class="group-title">Color</div><div class="row"><div class="field"><label for="fontColor">Tipografía</label><div class="color-field"><input id="fontColor" type="color" value="#f5f5f3"><span class="color-chip" id="fontColorValue">#f5f5f3</span></div></div><div class="field"><label for="backgroundColor">Fondo de la cuenta</label><div class="color-field"><input id="backgroundColor" type="color" value="#090a0c"><span class="color-chip" id="backgroundColorValue">#090a0c</span></div></div></div></section><section class="group"><div class="group-title">Ajuste general</div><div class="range-field"><label for="saturation">Saturación</label><input id="saturation" type="range" min="0" max="200" value="100"><output id="saturationValue">100%</output></div><div class="range-field"><label for="brightness">Brillo</label><input id="brightness" type="range" min="25" max="175" value="100"><output id="brightnessValue">100%</output></div><div class="range-field"><label for="contrast">Contraste</label><input id="contrast" type="range" min="0" max="200" value="100"><output id="contrastValue">100%</output></div><div class="range-field"><label for="highlights">Luces</label><input id="highlights" type="range" min="0" max="100" value="20"><output id="highlightsValue">20%</output></div><div class="range-field"><label for="sharpness">Nitidez</label><input id="sharpness" type="range" min="0" max="100" value="0"><output id="sharpnessValue">0%</output></div></section><section class="group"><div class="group-title">Efectos</div><div class="row"><div class="field"><label for="effect">Material de las letras</label><select id="effect" class="effect-select"><option value="none">Normal</option><option value="chrome">Cromado</option><option value="gold">Dorado</option><option value="metal">Metálico</option><option value="wood">Amaderado</option><option value="stone">Piedra</option><option value="neon">Neón</option><option value="ice">Hielo</option><option value="copper">Cobre</option></select></div><label class="toggle"><input id="depth3d" type="checkbox"> Efecto 3D</label></div></section></div></details></main><script>
const $=s=>document.querySelector(s),display=$('#display'),preview=$('#preview'),status=$('#status');let duration=1800,left=duration,running=false,last=performance.now(),recorder=null,fontFamily='Horizon';const settings={thickness:0,fontColor:'#f5f5f3',backgroundColor:'#090a0c',saturation:100,brightness:100,contrast:100,highlights:20,sharpness:0,effect:'none',depth3d:false};const materialStops={chrome:[[0,'#f9fbff'],[.18,'#555b63'],[.32,'#fff'],[.5,'#757c85'],[.68,'#eceff4'],[.84,'#41464d'],[1,'#f9fbff']],gold:[[0,'#fff2a6'],[.2,'#a66a08'],[.38,'#fff0a0'],[.55,'#d39a18'],[.75,'#704009'],[.9,'#ffdd55'],[1,'#fff4b5']],metal:[[0,'#e7e7e7'],[.25,'#777'],[.42,'#fafafa'],[.6,'#898989'],[.82,'#d7d7d7'],[1,'#555']],wood:[[0,'#f0c184'],[.18,'#81451f'],[.34,'#c88649'],[.5,'#5e3119'],[.72,'#dfaa6a'],[.88,'#6d371c'],[1,'#bd7b40']],stone:[[0,'#e4e0d8'],[.25,'#77746f'],[.45,'#c9c4bb'],[.65,'#5b5a58'],[.84,'#b8b3a9'],[1,'#686763']],neon:[[0,'#fff'],[.25,'#91f9ff'],[.5,'#6e8dff'],[.75,'#ff66dd'],[1,'#fff']],ice:[[0,'#fff'],[.25,'#95ecff'],[.5,'#efffff'],[.75,'#74bbef'],[1,'#fafdff']],copper:[[0,'#ffd1a3'],[.2,'#8a3e16'],[.42,'#f7a164'],[.6,'#a34e22'],[.82,'#e8a071'],[1,'#682d14']]};function readDuration(){const h=Math.max(0,Math.min(99,Number($('#hours').value)||0)),m=Math.max(0,Math.min(59,Number($('#minutes').value)||0)),s=Math.max(0,Math.min(59,Number($('#seconds').value)||0));return h*3600+m*60+s}function fmt(n){const v=Math.max(0,Math.ceil(n)),h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function paint(){display.textContent=fmt(left);display.classList.toggle('done',left<=0)}function loop(now){if(running){left=Math.max(0,left-(now-last)/1000);paint();if(left<=0){running=false;if(recorder?.state==='recording')recorder.stop()}}last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);$('#fontFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const family='CustomTimerFont';const face=new FontFace(family,await f.arrayBuffer());await face.load();document.fonts.add(face);fontFamily=family;document.documentElement.style.setProperty('--timer-font','"'+family+'"');$('#fontLabel').textContent='Fuente cargada: '+f.name;status.textContent='Tipografía aplicada a la vista previa y al video.'}catch(err){status.textContent='No se pudo cargar la fuente. Usa TTF, OTF, WOFF o WOFF2.'}};function cssGradient(effect){const stops=materialStops[effect];return stops?'linear-gradient(180deg,'+stops.map(x=>x[1]+' '+Math.round(x[0]*100)+'%').join(',')+')':'none'}function syncSettings(){const t=Number($('#thickness').value);settings.thickness=t;settings.fontColor=$('#fontColor').value;settings.backgroundColor=$('#backgroundColor').value;settings.saturation=Number($('#saturation').value);settings.brightness=Number($('#brightness').value);settings.contrast=Number($('#contrast').value);settings.highlights=Number($('#highlights').value);settings.sharpness=Number($('#sharpness').value);settings.effect=$('#effect').value;settings.depth3d=$('#depth3d').checked;$('#thicknessValue').textContent=(t>0?'+':'')+t;for(const id of ['saturation','brightness','contrast','highlights','sharpness'])$('#'+id+'Value').textContent=$('#'+id).value+'%';for(const [id,key] of [['fontColor','fontColor'],['backgroundColor','backgroundColor']])$('#'+id+'Value').textContent=settings[key].toUpperCase();preview.style.backgroundColor=settings.backgroundColor;preview.style.filter='saturate('+settings.saturation+'%) brightness('+settings.brightness+'%) contrast('+settings.contrast+'%)';display.style.fontWeight=String(Math.round(300+(t+100)*3));display.style.color=settings.effect==='none'?settings.fontColor:'transparent';display.style.backgroundImage=cssGradient(settings.effect);display.style.backgroundClip='text';display.style.webkitBackgroundClip='text';display.style.webkitTextFillColor=settings.effect==='none'?settings.fontColor:'transparent';const glow=Math.round(settings.highlights*.18);const crisp=settings.sharpness/100;const shadows=[];if(settings.depth3d){const layers=1+Math.round(settings.sharpness/15);for(let i=1;i<=layers;i++)shadows.push('0 '+(i*2)+'px 0 rgba(0,0,0,.48)')}if(glow)shadows.push('0 0 '+glow+'px rgba(255,255,255,'+(0.15+settings.highlights/250)+')');if(crisp){const d=Math.max(.15,crisp*.65);for(const [x,y] of [[-1,0],[1,0],[0,-1],[0,1]])shadows.push((x*d)+'px '+(y*d)+'px 0 '+settings.fontColor)}display.style.textShadow=shadows.join(',')||'none'}for(const id of ['thickness','fontColor','backgroundColor','saturation','brightness','contrast','highlights','sharpness','effect','depth3d'])$('#'+id).addEventListener('input',syncSettings);$('#depth3d').addEventListener('change',syncSettings);$('#start').addEventListener('click',()=>{if(left<=0)left=readDuration();if(left===duration)duration=readDuration();running=true;last=performance.now();status.textContent='Cuenta regresiva en marcha.'});$('#pause').addEventListener('click',()=>{running=false;status.textContent='Cuenta pausada.'});$('#reset').addEventListener('click',()=>{running=false;duration=readDuration();left=duration;paint();status.textContent='Cuenta reiniciada.'});for(const el of [$('#hours'),$('#minutes'),$('#seconds')])el.addEventListener('change',()=>{running=false;duration=readDuration();left=duration;paint()});function drawVideo(ctx,w,h){ctx.fillStyle=settings.backgroundColor;ctx.fillRect(0,0,w,h);ctx.save();ctx.filter='saturate('+settings.saturation+'%) brightness('+settings.brightness+'%) contrast('+settings.contrast+'%)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#a1a2a6';ctx.font='500 '+Math.round(h*.025)+'px system-ui,sans-serif';ctx.fillText('C U E N T A   R E G R E S I V A',w/2,h*.2);const weight=Math.round(300+(settings.thickness+100)*3);ctx.font=weight+' '+Math.round(h*.19)+'px "'+fontFamily+'",Arial,sans-serif';const gradient=ctx.createLinearGradient(w/2,h*.38,w/2,h*.62);const stops=materialStops[settings.effect];if(stops)for(const [pos,color] of stops)gradient.addColorStop(pos,color);ctx.fillStyle=stops?gradient:settings.fontColor;ctx.shadowColor='rgba(255,255,255,'+(settings.highlights/400)+')';ctx.shadowBlur=settings.highlights*.18;if(settings.depth3d){ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=0;const d=2+Math.round(settings.sharpness/20);for(let i=d;i>0;i--){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(fmt(left),w/2,h/2+i*2)}}if(settings.sharpness>0){ctx.lineWidth=settings.sharpness/100*1.25;ctx.strokeStyle=settings.fontColor;ctx.strokeText(fmt(left),w/2,h/2)}ctx.fillStyle=stops?gradient:settings.fontColor;ctx.shadowColor='rgba(255,255,255,'+(settings.highlights/400)+')';ctx.shadowBlur=settings.highlights*.18;ctx.fillText(fmt(left),w/2,h/2);ctx.restore()}$('#export').addEventListener('click',()=>{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){status.textContent='Este navegador no permite grabar video. Prueba Chrome o Edge.';return}if(recorder?.state==='recording')return;duration=readDuration();if(duration<1){status.textContent='Elige una duración de al menos un segundo.';return}left=duration;running=true;last=performance.now();paint();const [w,h]=$('#resolution').value.split('x').map(Number);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(30);let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';if(!MediaRecorder.isTypeSupported(mime)){status.textContent='Este navegador no admite exportación WebM.';return}const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});function frame(){drawVideo(ctx,w,h);if(recorder?.state==='recording')requestAnimationFrame(frame)}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuenta-regresiva-'+w+'x'+h+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);stream.getTracks().forEach(t=>t.stop());$('#export').textContent='Exportar video';status.textContent='Video descargado en '+w+' × '+h+' (WebM).'};recorder.start(1000);frame();$('#export').textContent='Grabando…';status.textContent='Grabando '+w+' × '+h+' en tiempo real. Mantén esta pestaña abierta; se descargará al llegar a cero.'});syncSettings();paint();
</script></body></html>
