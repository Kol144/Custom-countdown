<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta regresiva</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1b1f;--line:#303136;--text:#f5f5f3;--muted:#a1a2a6;--accent:#f3f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}.app{width:min(920px,100%);display:grid;gap:18px}.preview{min-height:390px;border:1px solid var(--line);border-radius:18px;background:#090a0c;display:grid;place-items:center;position:relative;overflow:hidden}.preview:before{content:"";position:absolute;width:min(58vw,410px);aspect-ratio:1;border:1px solid #ffffff16;border-radius:50%}.time{font-family:var(--timer-font, Horizon, Arial, sans-serif);font-size:clamp(5rem,17vw,12rem);font-weight:700;letter-spacing:.025em;font-variant-numeric:tabular-nums;z-index:1}.tag{position:absolute;top:24px;color:var(--muted);font-size:12px;letter-spacing:.23em}.done{color:#c5f2d0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:18px}.row{display:flex;align-items:end;flex-wrap:wrap;gap:14px}.field{display:grid;gap:6px}label,.caption{font-size:12px;color:var(--muted)}input,select,button,.file-button{height:42px;border-radius:10px;border:1px solid var(--line);background:#111216;color:var(--text);padding:0 12px;font:inherit}input[type=number]{width:86px}.file-button,button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.file-button:hover,button:hover{background:#27282d}.primary{background:var(--accent);color:#101114;border-color:var(--accent);font-weight:700}.primary:hover{background:#d8d8d3}.file-button input{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{min-height:18px;color:var(--muted);font-size:13px}.fontname{color:var(--text)}@media(max-width:560px){body{padding:14px}.preview{min-height:300px}.panel{padding:16px}.row{gap:10px}.time{font-size:19vw}}
</style></head><body><main class="app"><section class="preview" aria-label="Vista previa"><div class="tag">CUENTA REGRESIVA</div><div class="time" id="display">30:00</div></section><section class="panel"><div class="row"><div class="field"><label for="hours">Horas</label><input id="hours" type="number" min="0" max="99" value="0"></div><div class="field"><label for="minutes">Minutos</label><input id="minutes" type="number" min="0" max="59" value="30"></div><div class="field"><label for="seconds">Segundos</label><input id="seconds" type="number" min="0" max="59" value="0"></div><div class="field"><label for="resolution">Resolución de video</label><select id="resolution"><option value="854x480">480p</option><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K</option></select></div></div><div class="row"><div class="field"><label>Tipografía</label><label class="file-button">Añadir tipografía<input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/*"></label></div><div class="caption" id="fontLabel">Horizon (si está instalada) · si no, se usará Arial</div></div><div class="actions"><button id="start" class="primary">Iniciar cuenta</button><button id="pause">Pausar</button><button id="reset">Reiniciar</button><button id="export" class="primary">Exportar video</button></div><div class="status" id="status">El video se graba en tiempo real y se descarga al terminar.</div></section></main><script>
const $=s=>document.querySelector(s),display=$('#display'),status=$('#status'),preview=$('.preview');let duration=1800,left=duration,running=false,last=performance.now(),recorder=null,raf=0,fontFamily='Horizon';function readDuration(){const h=Math.max(0,Math.min(99,Number($('#hours').value)||0)),m=Math.max(0,Math.min(59,Number($('#minutes').value)||0)),s=Math.max(0,Math.min(59,Number($('#seconds').value)||0));return h*3600+m*60+s}function fmt(n){const v=Math.max(0,Math.ceil(n)),h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function paint(){display.textContent=fmt(left);display.classList.toggle('done',left<=0)}function loop(now){if(running){left=Math.max(0,left-(now-last)/1000);paint();if(left<=0){running=false;if(recorder?.state==='recording')recorder.stop()}}last=now;raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);$('#start').onclick=()=>{if(left<=0)left=readDuration();if(!duration||left===duration)duration=readDuration();running=true;last=performance.now();paint();status.textContent='Cuenta regresiva en marcha.'};$('#pause').onclick=()=>{running=false;status.textContent='Cuenta pausada.'};$('#reset').onclick=()=>{running=false;duration=readDuration();left=duration;paint();status.textContent='Cuenta reiniciada.'};for(const el of [$('#hours'),$('#minutes'),$('#seconds')])el.onchange=()=>{running=false;duration=readDuration();left=duration;paint()};$('#fontFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const family='CustomTimerFont';const face=new FontFace(family,await f.arrayBuffer());await face.load();document.fonts.add(face);fontFamily=family;document.documentElement.style.setProperty('--timer-font','"'+family+'"');$('#fontLabel').textContent='Fuente cargada: '+f.name;status.textContent='Tipografía aplicada a la vista previa y al video.'}catch(err){status.textContent='No se pudo cargar esa tipografía. Prueba con un archivo TTF, OTF o WOFF.'}};function drawVideo(ctx,w,h){ctx.fillStyle='#090a0c';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#a1a2a6';ctx.font='500 '+Math.round(h*.025)+'px system-ui, sans-serif';ctx.fillText('C U E N T A   R E G R E S I V A',w/2,h*.2);const r=Math.min(w,h)*.31;ctx.beginPath();ctx.arc(w/2,h/2,r,0,Math.PI*2);ctx.strokeStyle='#ffffff20';ctx.lineWidth=Math.max(2,h*.002);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,r,-Math.PI/2,-Math.PI/2+Math.PI*2*(duration?left/duration:0));ctx.strokeStyle='#f3f3ef';ctx.lineWidth=Math.max(3,h*.003);ctx.lineCap='round';ctx.stroke();ctx.fillStyle=left<=0?'#c5f2d0':'#f5f5f3';ctx.font='700 '+Math.round(h*.19)+'px "'+fontFamily+'",Arial,sans-serif';ctx.fillText(fmt(left),w/2,h/2);ctx.lineCap='butt'}$('#export').onclick=()=>{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){status.textContent='Este navegador no permite grabar video. Prueba Chrome o Edge.';return}if(recorder?.state==='recording'){status.textContent='La exportación ya está en curso.';return}duration=readDuration();if(duration<1){status.textContent='Elige una duración de al menos un segundo.';return}left=duration;running=true;last=performance.now();paint();const [w,h]=$('#resolution').value.split('x').map(Number);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(30);let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';if(!MediaRecorder.isTypeSupported(mime)){status.textContent='Este navegador no admite exportación WebM.';return}const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});function frame(){drawVideo(ctx,w,h);if(recorder?.state==='recording')requestAnimationFrame(frame)}frame();recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuenta-regresiva-'+w+'x'+h+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);stream.getTracks().forEach(t=>t.stop());$('#export').textContent='Exportar video';status.textContent='Video descargado en '+w+' × '+h+' (WebM).'};recorder.start(1000);frame();$('#export').textContent='Grabando…';status.textContent='Grabando '+w+' × '+h+' en tiempo real. Mantén esta pestaña abierta; se descargará al llegar a cero.'};paint();
</script></body></html>
